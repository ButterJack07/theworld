<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The World · 文明经营</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Georgia", "Times New Roman", "Songti SC", "SimSun", serif;
    color: #6b6f63;
    background: #f5efe2;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 28px 16px;
  }
  #app {
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
  }
  header { text-align: center; user-select: none; }
  h1 {
    font-size: 40px;
    font-weight: 500;
    letter-spacing: 10px;
    text-indent: 10px;
    color: #5e6e55;
  }
  .subtitle {
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: 7px;
    text-indent: 7px;
    color: #a8a99a;
  }
  .status { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .info-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid rgba(170, 166, 146, 0.35);
    background: rgba(255, 255, 255, 0.55);
    font-size: 12px;
    letter-spacing: 1px;
    color: #909184;
    user-select: none;
  }
  .info-row b { color: #5e6e55; font-weight: 600; font-size: 13px; }
  .frame {
    position: relative;
    padding: 18px;
    border-radius: 20px;
    background: rgba(255, 253, 247, 0.62);
    border: 1px solid rgba(180, 176, 156, 0.35);
    box-shadow:
      0 24px 70px rgba(150, 140, 110, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  canvas {
    display: block;
    border-radius: 10px;
    box-shadow: 0 14px 44px rgba(150, 140, 110, 0.28);
    cursor: crosshair;
  }
  .bar {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 14px;
  }
  .controls {
    position: fixed;
    top: 20px;
    left: 20px;
    display: flex;
    gap: 10px;
    z-index: 10;
  }
  button {
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 2px;
    color: #5e6e55;
    background: #ede6d3;
    border: 1px solid rgba(140, 150, 120, 0.4);
    padding: 8px 24px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.25s ease;
    user-select: none;
  }
  button.play-btn {
    width: 46px;
    height: 46px;
    padding: 0;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    letter-spacing: 0;
    font-size: 14px;
    line-height: 1;
  }
  button.play-btn span { line-height: 1; }
  button.play-btn b { font-size: 9px; font-weight: 600; letter-spacing: 0; }
  button.active {
    background: #e2d9c1;
    border-color: rgba(212, 178, 106, 0.65);
    box-shadow: 0 0 14px rgba(212, 178, 106, 0.35);
  }
  button:hover {
    background: #e2d9c1;
    border-color: rgba(120, 135, 100, 0.6);
    box-shadow: 0 6px 20px rgba(150, 140, 110, 0.25);
  }
  button:active { transform: translateY(1px); }
  #coord {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    color: #a8a99a;
    letter-spacing: 1px;
    user-select: none;
  }
  .stage {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    justify-content: center;
  }
  .side {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .side-bottom {
    display: flex;
    gap: 18px;
    align-items: flex-start;
  }
  .info-card {
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .top-right {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 10;
  }
  .pop-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(170, 166, 146, 0.35);
    background: rgba(255, 255, 255, 0.55);
    font-size: 13px;
    letter-spacing: 1px;
    color: #909184;
    user-select: none;
  }
  .pop-pill b { color: #5e6e55; font-weight: 600; }
  .pop-pill.civ {
    border-color: rgba(212, 178, 106, 0.45);
    background: rgba(255, 253, 247, 0.7);
  }
  .pop-pill.civ b { color: #a3823f; font-weight: 600; }
  .panel-title {
    font-size: 14px;
    letter-spacing: 4px;
    color: #8a8c7c;
    margin-bottom: 14px;
    text-align: center;
    user-select: none;
  }
  .inventory {
    position: relative;
    width: 336px;
    height: 168px;
    background-color: rgba(255, 255, 255, 0.4);
    background-image:
      linear-gradient(to right, rgba(170, 166, 146, 0.4) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(170, 166, 146, 0.4) 1px, transparent 1px);
    background-size: 42px 42px;
    border: 1px solid rgba(170, 166, 146, 0.4);
    transition: box-shadow 0.3s ease;
  }
  .inventory.gain { box-shadow: 0 0 22px rgba(214, 192, 143, 0.55); }
  .crafting {
    position: relative;
    width: 126px;
    height: 126px;
    background-color: rgba(255, 255, 255, 0.4);
    background-image:
      linear-gradient(to right, rgba(170, 166, 146, 0.4) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(170, 166, 146, 0.4) 1px, transparent 1px);
    background-size: 42px 42px;
    border: 1px solid rgba(170, 166, 146, 0.4);
  }
  .inv-item {
    position: absolute;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    transition: opacity 0.15s ease;
  }
  .inv-item svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .inv-item:hover { opacity: 0.85; }
  .inv-item.dragging { opacity: 0.35; cursor: grabbing; }
  @keyframes goldGlow {
    0%   { box-shadow: 0 0 0 2px rgba(212, 178, 106, 0.9), 0 0 10px rgba(212, 178, 106, 0.45); }
    50%  { box-shadow: 0 0 0 3px rgba(240, 205, 130, 0.95), 0 0 22px rgba(240, 205, 130, 0.85), 0 0 42px rgba(240, 205, 130, 0.5); }
    100% { box-shadow: 0 0 0 2px rgba(212, 178, 106, 0.9), 0 0 10px rgba(212, 178, 106, 0.45); }
  }
  .inv-item.longpress {
    animation: goldGlow 0.9s ease-in-out infinite;
  }
  .whole-badge {
    position: absolute;
    left: 1px;
    top: 1px;
    font-size: 8px;
    line-height: 10px;
    padding: 0 2px;
    color: #fff;
    background: rgba(168, 130, 50, 0.85);
    border-radius: 2px;
    letter-spacing: 0;
  }
  .count {
    position: absolute;
    right: 1px;
    bottom: 1px;
    min-width: 11px;
    height: 12px;
    padding: 0 2px;
    font-size: 9px;
    line-height: 12px;
    text-align: center;
    color: #fff;
    background: rgba(70, 70, 60, 0.78);
    border-radius: 2px;
    font-family: inherit;
  }
  .preview {
    position: absolute;
    border: 3px solid rgba(94, 183, 224, 0.6);
    background: rgba(94, 183, 224, 0.08);
    box-shadow: 0 0 14px rgba(94, 183, 224, 0.35), inset 0 0 6px rgba(94, 183, 224, 0.2);
    box-sizing: border-box;
    pointer-events: none;
    display: none;
    z-index: 5;
  }
  .craft-result {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .craft-hint {
    font-size: 11px;
    letter-spacing: 1px;
    color: #909184;
    text-align: center;
    user-select: none;
  }
  .craft-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 10px;
    border-radius: 8px;
    border: 1px solid rgba(170, 166, 146, 0.35);
    background: rgba(255, 255, 255, 0.5);
  }
  .craft-option .co-left {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .craft-option .co-name {
    font-size: 12px;
    letter-spacing: 1px;
    color: #5e6e55;
    white-space: nowrap;
    overflow: hidden;
  }
  .craft-option .co-req {
    font-size: 10px;
    color: #909184;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .craft-btn {
    font-size: 11px;
    padding: 4px 12px;
    letter-spacing: 2px;
    flex-shrink: 0;
  }
  .craft-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 1px solid rgba(0, 0, 0, 0.15);
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: middle;
  }
  .rc-icon {
    display: inline-block;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    vertical-align: middle;
  }
  .recipe-panel {
    position: fixed;
    top: 78px;
    left: 20px;
    width: 236px;
    max-height: calc(100vh - 110px);
    overflow-y: auto;
    z-index: 10;
    padding: 14px 16px;
    border-radius: 16px;
    background: rgba(255, 253, 247, 0.72);
    border: 1px solid rgba(180, 176, 156, 0.35);
    box-shadow:
      0 24px 70px rgba(150, 140, 110, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    user-select: none;
  }
  .recipe-group-title {
    font-size: 12px;
    letter-spacing: 3px;
    color: #8a8c7c;
    margin: 8px 0 6px;
    padding-bottom: 4px;
    border-bottom: 1px dashed rgba(170, 166, 146, 0.4);
  }
  .recipe-group-title:first-child { margin-top: 0; }
  .recipe-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 4px 8px;
    border-radius: 7px;
    font-size: 11px;
    line-height: 1.35;
  }
  .recipe-row:hover { background: rgba(255, 255, 255, 0.45); }
  .recipe-row .rc-left {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
  }
  .recipe-row .rc-name { color: #5e6e55; letter-spacing: 1px; white-space: nowrap; }
  .recipe-row .rc-req { color: #909184; text-align: right; white-space: nowrap; }
  .info-card { overflow-y: auto; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>The World</h1>
    <div class="subtitle" id="date">1 年 1 天</div>
  </header>

  <div class="top-right">
    <div class="pop-pill">人口 <b id="pop">1 / 5</b></div>
    <div class="pop-pill civ">文明程度 <b id="civ">0</b></div>
  </div>

  <div class="stage">
    <div class="frame">
      <canvas id="map"></canvas>
      <div class="bar">
        <div id="coord"></div>
      </div>
    </div>
    <div class="side">
      <div class="frame info-card">
        <div class="status" id="status"></div>
      </div>
      <div class="side-bottom">
        <div class="frame">
          <h2 class="panel-title">物品栏</h2>
          <div class="inventory" id="inventory"></div>
        </div>
        <div class="frame">
          <h2 class="panel-title">合成器</h2>
          <div class="crafting" id="crafting"></div>
          <div class="craft-result" id="craftResult"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="recipe-panel">
    <h2 class="panel-title">合成列表</h2>
    <div id="recipeList"></div>
  </div>
  <div class="controls">
    <button id="restart">重新开始</button>
    <button id="playBtn" class="play-btn"><span id="playIcon">❚❚</span><b id="speedLabel">1x</b></button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const MAP_W = 30;
  const MAP_H = 20;
  const CELL = 30;

  const TILE = { OCEAN: 0, LAND: 1 };

  const canvas = document.getElementById('map');
  const ctx = canvas.getContext('2d');
  canvas.width = MAP_W * CELL;
  canvas.height = MAP_H * CELL;

  const coordEl = document.getElementById('coord');
  const dateEl = document.getElementById('date');
  const popEl = document.getElementById('pop');
  const civEl = document.getElementById('civ');
  const statusEl = document.getElementById('status');
  const inventoryEl = document.getElementById('inventory');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const speedLabel = document.getElementById('speedLabel');

  // 模式: 0 = 1倍速运行, 1 = 2倍速运行, 2 = 暂停
  let mode = 0;
  let paused = false;
  let speed = 1;

  function applyMode() {
    if (mode === 0) { paused = false; speed = 1; }
    else if (mode === 1) { paused = false; speed = 2; }
    else { paused = true; speed = 1; }
  }
  function updateControls() {
    if (mode === 2) {
      playIcon.textContent = '❚❚';
      speedLabel.textContent = '已暂停';
      playBtn.title = '已暂停 · 点击开始';
    } else {
      playIcon.textContent = '▶';
      speedLabel.textContent = (mode === 1 ? '2x' : '1x');
      playBtn.title = mode === 1 ? '2倍速 · 点击暂停' : '1倍速 · 点击加速';
    }
    playBtn.classList.toggle('active', mode === 1);
  }
  playBtn.addEventListener('click', () => {
    mode = (mode + 1) % 3;
    applyMode();
    updateControls();
    saveState();
  });
  updateControls();

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  const SEED_KEY = 'tw-seed';
  let seed = parseInt(store.get(SEED_KEY), 10);
  if (!Number.isInteger(seed) || seed < 0) {
    seed = Math.floor(Math.random() * 1e9);
    store.set(SEED_KEY, String(seed));
  }

  // ---------- 噪声 ----------
  function hash(x, y) {
    let h = (x * 374761393 + y * 668265263) | 0;
    h = (h ^ (h >> 13)) | 0;
    h = Math.imul(h, 1274126177);
    return ((h ^ (h >> 16)) >>> 0) / 4294967296;
  }
  function noise2(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const a = hash(ix, iy), b = hash(ix + 1, iy);
    const c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
    const top = a + (b - a) * sx, bot = c + (d - c) * sx;
    return top + (bot - top) * sy;
  }

  // ---------- 地图生成 ----------
  function edgeDist(x, y) {
    return Math.min(x, y, MAP_W - 1 - x, MAP_H - 1 - y);
  }
  function removeLakes(map) {
    const seen = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(false));
    const q = [];
    const push = (x, y) => {
      if (map[y][x] !== TILE.OCEAN || seen[y][x]) return;
      seen[y][x] = true;
      q.push([x, y]);
    };
    for (let x = 0; x < MAP_W; x++) { push(x, 0); push(x, MAP_H - 1); }
    for (let y = 0; y < MAP_H; y++) { push(0, y); push(MAP_W - 1, y); }
    let head = 0;
    while (head < q.length) {
      const [x, y] = q[head++];
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H) continue;
        push(nx, ny);
      }
    }
    for (let y = 0; y < MAP_H; y++)
      for (let x = 0; x < MAP_W; x++)
        if (map[y][x] === TILE.OCEAN && !seen[y][x]) map[y][x] = TILE.LAND;
    return map;
  }
  function oceanPct(map) {
    return map.reduce((s, r) => s + r.filter(v => v === TILE.OCEAN).length, 0) / (MAP_W * MAP_H);
  }
  function generateMap(seed) {
    const ox = hash(seed, 13) * 1000;
    const oy = hash(seed, 29) * 1000;
    let lo = 0, hi = 1.2, best = null;
    for (let attempt = 0; attempt < 30; attempt++) {
      const threshold = (lo + hi) / 2;
      let map = Array.from({ length: MAP_H }, (_, y) =>
        Array.from({ length: MAP_W }, (_, x) => {
          const bias = 1 - edgeDist(x, y) / 9 + (noise2((x + ox) / 4, (y + oy) / 4) - 0.5) * 1.2;
          return bias > threshold ? TILE.OCEAN : TILE.LAND;
        }));
      removeLakes(map);
      const pct = oceanPct(map);
      if (pct >= 0.15 && pct <= 0.30) return map;
      if (best === null || Math.abs(pct - 0.225) < Math.abs(best.pct - 0.225)) best = { map, pct };
      if (pct < 0.15) hi = threshold; else lo = threshold;
    }
    return best.map;
  }

  let world = { map: generateMap(seed) };

  // ---------- 物品 ----------
  const ITEMS = [
    { id: 'wood',   name: '木头', color: '#c0b283', w: 1, h: 1 },
    { id: 'stone',  name: '石头', color: '#aaa69b', w: 1, h: 1 },
    { id: 'iron',   name: '铁矿', color: '#8a9a7b', w: 1, h: 1 },
    { id: 'food',   name: '食物', color: '#d6c08f', w: 1, h: 1 },
    { id: 'grain',  name: '粮食', color: '#d8c290', w: 1, h: 1 },
    { id: 'cloth',  name: '布匹', color: '#c9b8b3', w: 1, h: 1 },
    { id: 'gold',   name: '金矿', color: '#cfa86a', w: 1, h: 1 },
    { id: 'plank',  name: '木板', color: '#b7a678', w: 2, h: 1 },
    { id: 'brick',  name: '砖块', color: '#c49a83', w: 2, h: 2 },
    { id: 'hut',    name: '茅草屋', color: '#f0e2c0', w: 1, h: 1 },
    { id: 'lumber', name: '伐木场', color: '#e9dcba', w: 1, h: 1 },
    { id: 'mine',   name: '采矿场', color: '#dbd4c6', w: 1, h: 1 },
    { id: 'dock',   name: '钓船码头', color: '#cfe3e6', w: 1, h: 1 },
  ];

  // 卡通简约物品图标（统一 viewBox 40x40）
  const ITEM_ICONS = {
    wood: '<rect x="9" y="14" width="20" height="6" rx="3" fill="#c49a6a"/>' +
          '<rect x="9" y="14" width="20" height="6" rx="3" fill="none" stroke="#8a6a45" stroke-width="1.2"/>' +
          '<rect x="7" y="22" width="26" height="8" rx="4" fill="#b98f5f"/>' +
          '<rect x="7" y="22" width="26" height="8" rx="4" fill="none" stroke="#8a6a45" stroke-width="1.2"/>' +
          '<path d="M13 26h14" stroke="#8a6a45" stroke-width="1" opacity="0.5"/>',
    stone: '<path d="M10 27 Q8 18 14 15 Q20 12 26 15 Q32 18 30 27 Q28 31 20 31 Q12 31 10 27 Z" fill="#b3ada2"/>' +
           '<path d="M10 27 Q8 18 14 15 Q20 12 26 15 Q32 18 30 27 Q28 31 20 31 Q12 31 10 27 Z" fill="none" stroke="#7d7a70" stroke-width="1.2"/>' +
           '<path d="M15 16 q3 -3 6 -1" stroke="#fff" stroke-width="1.4" fill="none" opacity="0.6"/>' +
           '<path d="M13 24 q6 2 12 0" stroke="#8a8378" stroke-width="1" fill="none" opacity="0.6"/>',
    iron: '<rect x="10" y="15" width="20" height="13" rx="3" fill="#a7a29a"/>' +
          '<rect x="10" y="15" width="20" height="13" rx="3" fill="none" stroke="#6f6c64" stroke-width="1.2"/>' +
          '<path d="M10 19h20" stroke="#6f6c64" stroke-width="1" opacity="0.5"/>' +
          '<path d="M16 21q2 -2 4 0q3 2 5 0" stroke="#8a9a7b" stroke-width="1.6" fill="none" opacity="0.9"/>',
    food: '<ellipse cx="19" cy="20" rx="12" ry="7" fill="#e0a078"/>' +
          '<ellipse cx="19" cy="20" rx="12" ry="7" fill="none" stroke="#b57a50" stroke-width="1.2"/>' +
          '<path d="M7 20 L3 15 L3 25 Z" fill="#e0a078" stroke="#b57a50" stroke-width="1.2"/>' +
          '<circle cx="24" cy="18" r="1.4" fill="#b57a50"/>' +
          '<path d="M12 20 q3 -2 6 0" stroke="#b57a50" stroke-width="1" fill="none" opacity="0.5"/>',
    grain: '<rect x="19" y="18" width="2" height="13" rx="1" fill="#b98f4f"/>' +
           '<ellipse cx="20" cy="17" rx="6.5" ry="4.5" fill="#e6cc6a"/>' +
           '<ellipse cx="20" cy="17" rx="6.5" ry="4.5" fill="none" stroke="#a3823f" stroke-width="1.2"/>' +

  function occupancy(list, cols, rows) {
    const occ = Array.from({ length: rows }, () => Array(cols).fill(null));
    list.forEach((p, i) => {
      for (let r = p.row; r < p.row + p.item.h; r++)
        for (let c = p.col; c < p.col + p.item.w; c++) occ[r][c] = i;
    });
    return occ;
  }
  function canPlace(item, col, row, list, cols, rows, ignoreIdx) {
    if (col < 0 || row < 0 || col + item.w > cols || row + item.h > rows) return false;
    const occ = occupancy(list, cols, rows);
    for (let r = row; r < row + item.h; r++)
      for (let c = col; c < col + item.w; c++)
        if (occ[r][c] !== null && occ[r][c] !== ignoreIdx) return false;
    return true;
  }
  function findFreeSpot(item, list, cols, rows) {
    for (let row = 0; row <= rows - item.h; row++)
      for (let col = 0; col <= cols - item.w; col++)
        if (canPlace(item, col, row, list, cols, rows)) return { col, row };
    return null;
  }
  function initInventory() {
    const list = [];
    const add = (id, count) => {
      const item = ITEMS.find(i => i.id === id);
      const spot = findFreeSpot(item, list, INV_COLS, INV_ROWS);
      if (spot) list.push({ item, col: spot.col, row: spot.row, count });
    };
    add('wood', 10);
    add('stone', 6);
    add('iron', 3);
    add('cloth', 2);
    return list;
  }
  function addItemToInventory(id, amount) {
    const item = ITEMS.find(i => i.id === id);
    let remaining = amount;
    const added = [];
    for (const p of placed) {
      if (p.item.id === id && p.count < MAX_STACK) {
        const take = Math.min(remaining, MAX_STACK - p.count);
        p.count += take;
        added.push({ p, n: take });
        remaining -= take;
        if (remaining === 0) break;
      }
    }
    if (remaining > 0) {
      const spot = findFreeSpot(item, placed, INV_COLS, INV_ROWS);
      if (!spot) {
        added.forEach(a => { a.p.count -= a.n; });
        return false;
      }
      const take = Math.min(remaining, MAX_STACK);
      placed.push({ item, col: spot.col, row: spot.row, count: take });
      remaining -= take;
      if (remaining > 0) return false;
    }
    flashInventory();
    renderInventory();
    return true;
  }

  // 双击：把同种物品的所有堆合并到当前堆上（每堆上限 MAX_STACK）
  function mergeStacks(target, from) {
    const grid = from === 'inventory' ? placed : craftingItems;
    const same = grid.filter(g => g !== target && g.item.id === target.item.id);
    for (const s of same) {
      const take = Math.min(s.count, MAX_STACK - target.count);
      if (take <= 0) break;
      target.count += take;
      s.count -= take;
      if (s.count <= 0) {
        const idx = grid.indexOf(s);
        if (idx >= 0) grid.splice(idx, 1);
      }
      if (target.count >= MAX_STACK) break;
    }
    if (from === 'inventory') renderInventory();
    else renderCrafting();
    saveState();
  }

  function canAddToInventory(id, amount) {
    if (placed.find(p => p.item.id === id)) return true;

    return !!findFreeSpot(item, placed, INV_COLS, INV_ROWS);

  function countInGrid(list, id) {
    return list.filter(p => p.item.id === id).reduce((s, p) => s + p.count, 0);
  }
  function matchingRecipes() {
    return RECIPES.filter(r => r.req.every(q => countInGrid(craftingItems, q.id) >= q.n));
  }
  function reqText(req) {
    return req.map(q => `${ITEMS.find(i => i.id === q.id).name}×${q.n}`).join(' + ');
  }
  function craftRecipe(r) {
    if (!matchingRecipes().includes(r)) return;
    if (!canAddToInventory(r.out, 1)) return;
    r.req.forEach(q => {
      let need = q.n;
      for (let i = 0; i < craftingItems.length && need > 0; i++) {
        const p = craftingItems[i];
        if (p.item.id !== q.id) continue;
        const take = Math.min(need, p.count);
        p.count -= take;
        need -= take;
        if (p.count <= 0) { craftingItems.splice(i, 1); i--; }
      }
    });
    addItemToInventory(r.out, 1);
    renderCrafting();
    saveState();

    if (saved && saved.seed === seed) {
      state = {
        villagers: saved.villagers || 0,

        buildings: (saved.buildings || []).filter(b => BUILDINGS[b.id]),

  // ---------- 小人（生产力）：占据一个格子的圆形，静止不动 ----------
  function hutCapacity() {
    return state.buildings.filter(b => b.id === 'hut').length * BUILDINGS.hut.capacity;
  }
  function findVillagerSpot(existingCells) {
    const huts = state.buildings.filter(b => b.id === 'hut');
    if (!huts.length) return null;
    const used = new Set();
    state.buildings.forEach(b => used.add(b.x + ',' + b.y));
    existingCells.forEach(v => used.add(v.x + ',' + v.y));
    for (const hut of huts) {
      for (let r = 1; r <= 5; r++) {
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) {
            if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
            const x = hut.x + dx, y = hut.y + dy;
            if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) continue;
            if (world.map[y][x] !== TILE.LAND) continue;
            if (used.has(x + ',' + y)) continue;
            return { x, y };
          }
        }
      }
    }
    return null;
  }

  // ---------- 绘制 ----------
  const OCEAN_COLOR = '#a4becb';
  const LAND_COLOR  = '#b5c5a3';
  const GRID_LINE   = 'rgba(255, 253, 247, 0.5)';

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 统一圆角矩形卡通风建筑：阴影 + 主体 + 屋顶带 + 下沿高光 + 门 + 专属徽记
  function drawBuildingEntity(b) {
    const def = BUILDINGS[b.id];
    const px = b.x * CELL, py = b.y * CELL;
    const cx = px + CELL / 2;
    const bx = px + 4, by = py + 5, bw = CELL - 8, bh = CELL - 10, br = 7;
    const roofH = Math.round(bh * 0.42);

    ctx.lineWidth = 1;
    // 阴影
    ctx.fillStyle = 'rgba(120, 110, 90, 0.16)';
    rr(bx + 1, by + 2, bw, bh, br);
    ctx.fill();
    // 主体
    ctx.fillStyle = def.body;
    rr(bx, by, bw, bh, br);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120, 110, 90, 0.35)';
    ctx.stroke();
    // 屋顶带
    ctx.fillStyle = def.roof;
    rr(bx, by, bw, roofH, br);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120, 110, 90, 0.3)';
    ctx.stroke();
    // 屋顶纹理线
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.beginPath();
    ctx.moveTo(bx + 3, by + roofH - 3);
    ctx.lineTo(bx + bw - 3, by + roofH - 3);
    ctx.stroke();
    // 下沿高光
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.beginPath();
    ctx.moveTo(bx + 2, by + bh - 1.5);
    ctx.lineTo(bx + bw - 2, by + bh - 1.5);
    ctx.stroke();

    const gy = by + roofH;
    const bottom = by + bh;
    // 门（统一）
    ctx.fillStyle = def.accent;
    rr(cx - 3, bottom - 8, 6, 8, 2.5);
    ctx.fill();
    // 专属徽记
    switch (b.id) {
      case 'hut':
        // 小窗
        ctx.fillStyle = '#fffdf5';
        rr(cx + 4, gy + 4, 6, 6, 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(120, 100, 70, 0.4)';
        ctx.stroke();
        break;
      case 'lumber':
        // 原木堆
        ctx.fillStyle = def.accent;
        rr(cx - 8, gy + 5, 7, 5, 2); ctx.fill();
        rr(cx - 1, gy + 5, 7, 5, 2); ctx.fill();
        rr(cx - 4, gy + 11, 7, 5, 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(cx - 8, gy + 7); ctx.lineTo(cx - 1, gy + 7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx - 1, gy + 7); ctx.lineTo(cx + 6, gy + 7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx - 4, gy + 13); ctx.lineTo(cx + 3, gy + 13); ctx.stroke();
        break;
      case 'mine':
        // 矿洞入口 + 碎石
        ctx.fillStyle = 'rgba(90, 88, 82, 0.85)';
        rr(cx - 5, gy + 6, 10, 8, 3);
        ctx.fill();
        ctx.fillStyle = '#8d8a80';
        rr(cx - 9, gy + 6, 3, 3, 1); ctx.fill();
        rr(cx + 6, gy + 5, 3, 3, 1); ctx.fill();
        rr(cx - 8, gy + 11, 2, 2, 1); ctx.fill();
        rr(cx + 6, gy + 12, 2, 2, 1); ctx.fill();
        break;
      case 'dock':
        // 小鱼
        ctx.fillStyle = '#e0a078';
        ctx.beginPath();
        ctx.ellipse(cx - 1, gy + 8, 5, 3.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx - 6, gy + 8);
        ctx.lineTo(cx - 9, gy + 5);
        ctx.lineTo(cx - 9, gy + 11);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#6f98a3';
        ctx.beginPath();
        ctx.arc(cx + 2, gy + 7, 0.9, 0, Math.PI * 2);
        ctx.fill();
        break;
    }
  }

  function drawVillagers() {
    state.villagersCells.forEach(v => {
      const cx = v.x * CELL + CELL / 2;
      const cy = v.y * CELL + CELL / 2;
      ctx.fillStyle = '#c0a078';
      ctx.beginPath();
      ctx.arc(cx, cy, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.beginPath();
      ctx.arc(cx, cy - 2, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(120, 90, 60, 0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, 9, 0, Math.PI * 2);
      ctx.stroke();
    });
  }

  function drawWorld() {
    const map = world.map;
    ctx.fillStyle = '#f5efe2';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < MAP_H; y++) {
      for (let x = 0; x < MAP_W; x++) {
        ctx.fillStyle = map[y][x] === TILE.OCEAN ? OCEAN_COLOR : LAND_COLOR;
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        ctx.strokeStyle = GRID_LINE;
        ctx.lineWidth = 1;
        ctx.strokeRect(x * CELL + 0.5, y * CELL + 0.5, CELL - 1, CELL - 1);
      }
    }
    state.buildings.forEach(drawBuildingEntity);
    drawVillagers();
    // 拖放建筑落点预览
    if (dragBuildingId && hoverCell && hoverCell.x >= 0 && hoverCell.x < MAP_W && hoverCell.y >= 0 && hoverCell.y < MAP_H) {
      const ok = canBuildAt(dragBuildingId, hoverCell.x, hoverCell.y);
      ctx.fillStyle = ok ? 'rgba(94, 183, 224, 0.22)' : 'rgba(190, 84, 70, 0.22)';
      rr(hoverCell.x * CELL + 1, hoverCell.y * CELL + 1, CELL - 2, CELL - 2, 7);
      ctx.fill();
      ctx.strokeStyle = ok ? 'rgba(94, 183, 224, 0.7)' : 'rgba(190, 84, 70, 0.7)';
      ctx.lineWidth = 1;
      ctx.stroke();
      if (ok) {
        ctx.globalAlpha = 0.55;
        drawBuildingEntity({ id: dragBuildingId, x: hoverCell.x, y: hoverCell.y });
        ctx.globalAlpha = 1;
      }
    }
  }

  // 悬停显示坐标
  canvas.addEventListener('mousemove', (e) => {
    if (dragBuildingId) return;
    const r = canvas.getBoundingClientRect();
    const gx = Math.floor((e.clientX - r.left) / CELL);
    const gy = Math.floor((e.clientY - r.top) / CELL);
    hoverCell = { x: gx, y: gy };
    if (gx >= 0 && gx < MAP_W && gy >= 0 && gy < MAP_H) {
      coordEl.textContent = `( ${gx}, ${gy} )`;
    } else {
      coordEl.textContent = '';
    }
  });
  canvas.addEventListener('mouseleave', () => {
    if (dragBuildingId) return;
    coordEl.textContent = '';
    hoverCell = null;
  });

  // ---------- 建造系统：从物品栏把建筑拖到地图上安装 ----------
  function canvasCell(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: Math.floor((e.clientX - r.left) / CELL),
      y: Math.floor((e.clientY - r.top) / CELL)
    };
  }
  function isBuildingItem(id) {
    return !!BUILDINGS[id];
  }
  function canBuildAt(id, x, y) {
    if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) return false;
    if (world.map[y][x] !== TILE.LAND) return false;
    if (state.buildings.some(b => b.x === x && b.y === y)) return false;
    if (state.villagersCells.some(v => v.x === x && v.y === y)) return false;
    if (id === 'dock') {
      const nearWater = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {
        const nx = x + dx, ny = y + dy;
        return nx >= 0 && nx < MAP_W && ny >= 0 && ny < MAP_H && world.map[ny][nx] === TILE.OCEAN;
      });
      if (!nearWater) return false;
    }
    return true;
  }
  function takeOneFrom(grid, entry) {
    const idx = grid.indexOf(entry);
    if (idx < 0) return false;
    const src = grid[idx];
    src.count -= 1;
    if (src.count <= 0) grid.splice(idx, 1);
    return true;
  }
  function installBuilding(itemId, x, y) {
    const from = dragContext ? dragContext.from : null;
    const grid = from === 'crafting' ? craftingItems : placed;
    if (!takeOneFrom(grid, dragContext.entry)) return;
    state.buildings.push({ id: itemId, x, y });
    dragContext = null;
    dragBuildingId = null;
    renderInventory();
    renderCrafting();
    updateStatus();
    saveState();
    drawWorld();
  }

  canvas.addEventListener('dragover', (e) => {
    if (!dragContext) return;
    const item = ITEMS.find(i => i.id === dragContext.id);
    if (!item || !isBuildingItem(item.id)) { dragBuildingId = null; return; }
    e.preventDefault();
    const c = canvasCell(e);
    hoverCell = { x: c.x, y: c.y };
    dragBuildingId = item.id;
    const ok = canBuildAt(item.id, c.x, c.y);
    coordEl.textContent = ok ? '松手放置建筑' : '此处无法建造';
    drawWorld();
  });
  canvas.addEventListener('dragleave', () => {
    dragBuildingId = null;
    coordEl.textContent = '';
    drawWorld();
  });
  canvas.addEventListener('drop', (e) => {
    e.preventDefault();
    dragBuildingId = null;
    if (!dragContext) return;
    const item = ITEMS.find(i => i.id === dragContext.id);
    if (!item || !isBuildingItem(item.id)) return;
    const c = canvasCell(e);
    if (!canBuildAt(item.id, c.x, c.y)) { drawWorld(); return; }
    installBuilding(item.id, c.x, c.y);
  });

  // ---------- 物品栏渲染与拖动 ----------
  const previewEl = document.createElement('div');
  previewEl.className = 'preview';
  inventoryEl.appendChild(previewEl);

  function cellAt(e) {
    const r = inventoryEl.getBoundingClientRect();
    return {
      col: Math.floor((e.clientX - r.left) / INV_CELL),
      row: Math.floor((e.clientY - r.top) / INV_CELL)
    };
  }
  function showPreview(col, row, w, h) {
    previewEl.style.display = 'block';
    previewEl.style.left = col * INV_CELL + 'px';
    previewEl.style.top = row * INV_CELL + 'px';
    previewEl.style.width = w * INV_CELL + 'px';
    previewEl.style.height = h * INV_CELL + 'px';
  }
  function hidePreview() { previewEl.style.display = 'none'; }

  // 绑定物品元素的长按与拖拽：默认拖动 1 个，长按 0.5s 后拖动整组
  function bindDrag(el, p, from) {
    el.addEventListener('mousedown', () => {
      pressing = true;
      longPress = false;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => {
        if (!pressing) return;
        longPress = true;
        el.classList.add('longpress');
        if (!el.querySelector('.whole-badge')) {
          const b = document.createElement('span');
          b.className = 'whole-badge';
          b.textContent = '整组';
          el.appendChild(b);
        }
      }, 500);
    });
    el.addEventListener('dblclick', () => {
      mergeStacks(p, from);
    });
    el.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', p.item.id);
      e.dataTransfer.setDragImage(el, 20, 20);
      dragContext = { id: p.item.id, from, whole: longPress, entry: p };
      el.classList.add('dragging');
      pressing = false;
      clearTimeout(pressTimer);
      el.classList.remove('longpress');
      const b = el.querySelector('.whole-badge');
      if (b) b.remove();
    });
    el.addEventListener('dragend', () => {
      dragContext = null;
      longPress = false;
      pressing = false;
      el.classList.remove('dragging');
      el.classList.remove('longpress');
      const b = el.querySelector('.whole-badge');
      if (b) b.remove();
      hidePreview();
      hideCraftPreview();
    });
  }

  // 判断当前拖动能否放入物品栏 (col,row)
  function overlap(aCol, aRow, aItem, b) {
    return aCol < b.col + b.item.w && aCol + aItem.w > b.col &&
           aRow < b.row + b.item.h && aRow + aItem.h > b.row;
  }
  function mergeTargetIn(grid, excludeEntry, item, col, row) {
    return grid.find(g => g !== excludeEntry && g.item.id === item.id && overlap(col, row, item, g));
  }
  function canDropInventory(item, col, row) {
    if (mergeTargetIn(placed, dragContext.from === 'inventory' ? dragContext.entry : null, item, col, row)) return true;
    if (dragContext.from === 'inventory') {
      const idx = placed.indexOf(dragContext.entry);
      if (idx < 0) return false;
      const srcCount = placed[idx].count;
      if (dragContext.whole || srcCount === 1)
        return canPlace(item, col, row, placed, INV_COLS, INV_ROWS, idx);
      return canPlace(item, col, row, placed, INV_COLS, INV_ROWS);
    }
    return canPlace(item, col, row, placed, INV_COLS, INV_ROWS);
  }

  // 判断当前拖动能否放入合成器 (col,row)；建筑成品不能放进合成器
  function canDropCrafting(item, col, row) {
    if (BUILDINGS[item.id]) return false;
    if (mergeTargetIn(craftingItems, dragContext.from === 'crafting' ? dragContext.entry : null, item, col, row)) return true;
    if (dragContext.from === 'crafting') {
      const idx = craftingItems.indexOf(dragContext.entry);
      if (idx < 0) return false;
      const srcCount = craftingItems[idx].count;
      if (dragContext.whole || srcCount === 1)
        return canPlace(item, col, row, craftingItems, CRAFT_COLS, CRAFT_ROWS, idx);
      return canPlace(item, col, row, craftingItems, CRAFT_COLS, CRAFT_ROWS);
    }
    return canPlace(item, col, row, craftingItems, CRAFT_COLS, CRAFT_ROWS);
  }

  function renderInventory() {
    inventoryEl.querySelectorAll('.inv-item').forEach(n => n.remove());
    placed.forEach(p => {
      const el = document.createElement('div');
      el.className = 'inv-item';
      el.draggable = true;
      el.title = p.item.name;
      el.innerHTML = itemIconSVG(p.item.id);
      el.style.left = p.col * INV_CELL + 1 + 'px';
      el.style.top = p.row * INV_CELL + 1 + 'px';
      el.style.width = p.item.w * INV_CELL - 2 + 'px';
      el.style.height = p.item.h * INV_CELL - 2 + 'px';
      if (p.count > 1) {
        const b = document.createElement('span');
        b.className = 'count';
        b.textContent = p.count;
        el.appendChild(b);
      }
      bindDrag(el, p, 'inventory');
      inventoryEl.appendChild(el);
    });
  }

  inventoryEl.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (!dragContext) return;
    const item = ITEMS.find(i => i.id === dragContext.id);
    if (!item) return;
    const { col, row } = cellAt(e);
    if (canDropInventory(item, col, row)) showPreview(col, row, item.w, item.h);
    else hidePreview();
  });

  inventoryEl.addEventListener('drop', (e) => {
    e.preventDefault();
    if (!dragContext) return;
    const item = ITEMS.find(i => i.id === dragContext.id);
    if (!item) return;
    const { col, row } = cellAt(e);
    if (dragContext.from === 'inventory') {
      const idx = placed.indexOf(dragContext.entry);
      if (idx < 0) { hidePreview(); return; }
      if (!canDropInventory(item, col, row)) { hidePreview(); return; }
      const src = placed[idx];
      const moveAmt = dragContext.whole ? src.count : 1;
      src.count -= moveAmt;
      if (src.count <= 0) placed.splice(idx, 1);
      const mt = mergeTargetIn(placed, src, item, col, row);
      if (mt) mt.count += moveAmt;
      else placed.push({ item, col, row, count: moveAmt });
      renderInventory();
      saveState();
    } else if (dragContext.from === 'crafting') {
      const cIdx = craftingItems.indexOf(dragContext.entry);
      if (cIdx < 0) { hidePreview(); return; }
      if (!canDropInventory(item, col, row)) { hidePreview(); return; }
      const src = craftingItems[cIdx];
      const moveAmt = dragContext.whole ? src.count : 1;
      src.count -= moveAmt;
      if (src.count <= 0) craftingItems.splice(cIdx, 1);
      const mt = mergeTargetIn(placed, null, item, col, row);
      if (mt) mt.count += moveAmt;
      else placed.push({ item, col, row, count: moveAmt });
      renderInventory();
      renderCrafting();
      saveState();
    }
    hidePreview();
  });

  // ---------- 合成器渲染与拖动 ----------
  const craftPreviewEl = document.createElement('div');
  craftPreviewEl.className = 'preview';
  craftingEl.appendChild(craftPreviewEl);

  function craftCellAt(e) {
    const r = craftingEl.getBoundingClientRect();
    return {
      col: Math.floor((e.clientX - r.left) / CRAFT_CELL),
      row: Math.floor((e.clientY - r.top) / CRAFT_CELL)
    };
  }
  function showCraftPreview(col, row, w, h) {
    craftPreviewEl.style.display = 'block';
    craftPreviewEl.style.left = col * CRAFT_CELL + 'px';
    craftPreviewEl.style.top = row * CRAFT_CELL + 'px';
    craftPreviewEl.style.width = w * CRAFT_CELL + 'px';
    craftPreviewEl.style.height = h * CRAFT_CELL + 'px';
  }
  function hideCraftPreview() { craftPreviewEl.style.display = 'none'; }

  function renderCrafting() {
    craftingEl.querySelectorAll('.inv-item').forEach(n => n.remove());
    craftingItems.forEach(p => {
      const el = document.createElement('div');
      el.className = 'inv-item';
      el.draggable = true;
      el.title = p.item.name;
      el.innerHTML = itemIconSVG(p.item.id);
      el.style.left = p.col * CRAFT_CELL + 1 + 'px';
      el.style.top = p.row * CRAFT_CELL + 1 + 'px';
      el.style.width = p.item.w * CRAFT_CELL - 2 + 'px';
      el.style.height = p.item.h * CRAFT_CELL - 2 + 'px';
      if (p.count > 1) {
        const b = document.createElement('span');
        b.className = 'count';
        b.textContent = p.count;
        el.appendChild(b);
      }
      bindDrag(el, p, 'crafting');
      craftingEl.appendChild(el);
    });
    renderCraftResult();
  }

  craftingEl.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (!dragContext) return;
    const item = ITEMS.find(i => i.id === dragContext.id);
    if (!item) return;
    const { col, row } = craftCellAt(e);
    if (canDropCrafting(item, col, row)) showCraftPreview(col, row, item.w, item.h);
    else hideCraftPreview();
  });

  craftingEl.addEventListener('drop', (e) => {
    e.preventDefault();
    if (!dragContext) return;
    const item = ITEMS.find(i => i.id === dragContext.id);
    if (!item) return;
    const { col, row } = craftCellAt(e);
    if (dragContext.from === 'inventory') {
      const iIdx = placed.indexOf(dragContext.entry);
      if (iIdx < 0 || !canDropCrafting(item, col, row)) { hideCraftPreview(); return; }
      const src = placed[iIdx];
      const moveAmt = dragContext.whole ? src.count : 1;
      src.count -= moveAmt;
      if (src.count <= 0) placed.splice(iIdx, 1);
      const mt = mergeTargetIn(craftingItems, null, item, col, row);
      if (mt) mt.count += moveAmt;
      else craftingItems.push({ item, col, row, count: moveAmt });
      renderInventory();
      renderCrafting();
      saveState();
    } else if (dragContext.from === 'crafting') {
      const cIdx = craftingItems.indexOf(dragContext.entry);
      if (cIdx < 0 || !canDropCrafting(item, col, row)) { hideCraftPreview(); return; }
      const src = craftingItems[cIdx];
      const moveAmt = dragContext.whole ? src.count : 1;
      src.count -= moveAmt;
      if (src.count <= 0) craftingItems.splice(cIdx, 1);
      const mt = mergeTargetIn(craftingItems, src, item, col, row);
      if (mt) mt.count += moveAmt;
      else craftingItems.push({ item, col, row, count: moveAmt });
      renderCrafting();
      saveState();
    }
    hideCraftPreview();
  });

  // ---------- 状态栏 ----------
  function updateStatus() {
    popEl.textContent = state.villagers + ' / ' + hutCapacity();
    civEl.textContent = state.civ;
    const year = Math.floor((displayDay - 1) / 365) + 1;
    const day = (displayDay - 1) % 365 + 1;
    dateEl.textContent = `${year} 年 ${day} 天`;
    statusEl.innerHTML = '';
    const buildings = state.buildings.map(b => ({ b, def: BUILDINGS[b.id] }));
    buildings.forEach(({ def }) => {
      const row = document.createElement('div');
      row.className = 'info-row';
      const label = document.createElement('span');
      const items = def.produces.map(p => ITEMS.find(i => i.id === p.item).name).join(' + ');
      label.textContent = `${def.name} · 每 ${def.interval}s 产出${items}`;
      const amt = document.createElement('b');
      amt.textContent = '+' + def.produces.reduce((s, p) => s + p.amount, 0);
      row.append(label, amt);
      statusEl.appendChild(row);
    });
  }

  // ---------- 游戏循环 ----------
  let popTimer = 0;
  let saveTick = 0;

  function tickBuilding(b, def) {
    b.timer = (b.timer || 0) + speed;
    if (b.timer >= def.interval) {
      b.timer = 0;
      let produced = false;
      def.produces.forEach(p => {
        if (addItemToInventory(p.item, p.amount)) {
          state.civ += p.amount;
          produced = true;
        }
      });
      if (produced) saveState();
    }
  }

  function tick() {
    if (paused) { drawWorld(); return; }
    state.buildings.forEach(b => tickBuilding(b, BUILDINGS[b.id]));
    popTimer += speed;
    if (popTimer >= 20 && state.villagers < hutCapacity()) {
      const spot = findVillagerSpot(state.villagersCells);
      if (spot) {
        state.villagersCells.push(spot);
        state.villagers++;
      }
      popTimer = 0;
      saveState();
    }
    state.day += speed;
    displayDay += 1;
    updateStatus();
    drawWorld();
    saveTick++;
    if (saveTick >= 5) {
      saveTick = 0;
      saveState();
    }
  }

  // ---------- 启动 ----------
  renderRecipeList();
  renderInventory();
  renderCrafting();
  updateStatus();
  drawWorld();
  setInterval(tick, 500);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The World · 文明经营</title>
<link rel="stylesheet" href="css/style.css">

</head>
<body>
<div id="app">
  <header>
    <h1>The World</h1>
    <div class="subtitle" id="date">1 年 1 天</div>
  </header>

  <div class="top-right">
    <div class="pop-pill">人口 <b id="pop">1 / 5</b></div>
    <div class="pop-pill civ">文明程度 <b id="civ">0</b></div>
  </div>

  <div class="stage">
    <div class="frame">
      <canvas id="map"></canvas>
      <div class="bar">
        <div id="coord"></div>
      </div>
    </div>
    <div class="side">
      <div class="frame info-card">
        <div class="status" id="status"></div>
      </div>
      <div class="side-bottom">
        <div class="frame">
          <h2 class="panel-title">物品栏</h2>
          <div class="inventory" id="inventory"></div>
        </div>
        <div class="frame">
          <h2 class="panel-title">合成器</h2>
          <div class="crafting" id="crafting"></div>
          <div class="craft-result" id="craftResult"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="recipe-panel">
    <h2 class="panel-title">合成列表</h2>
    <div id="recipeList"></div>
  </div>
  <div class="controls">
    <button id="restart">重新开始</button>
    <button id="playBtn" class="play-btn"><span id="playIcon">❚❚</span><b id="speedLabel">1x</b></button>
  </div>
</div>


<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/world.js"></script>
<script src="js/state.js"></script>
<script src="js/inventory.js"></script>
<script src="js/crafting.js"></script>
<script src="js/main.js"></script>
</body>
</html>
